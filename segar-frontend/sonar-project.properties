# SonarQube Configuration for SEGAR Frontend

# Project Information
sonar.projectKey=Segar-Frontend
sonar.projectName=Segar-Frontend
sonar.projectVersion=1.0.0

# Sources and Tests
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/test-helpers.ts,**/setup-jest.ts

# TypeScript Configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Coverage Configuration
sonar.coverage.exclusions=**/*.spec.ts,**/test-helpers.ts,**/setup-jest.ts,**/*.mock.ts

# Source Encoding
sonar.sourceEncoding=UTF-8

# Host and Token (configurar al ejecutar)
sonar.host.url=http://localhost:9000
sonar.token=sqp_c4e6dd6805f5377014c5991cb2e6f1662325c30c

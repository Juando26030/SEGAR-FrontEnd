<!-- Sidebar Mejorado -->
<aside class="w-64 bg-gradient-to-b from-[#1a3b6d] to-[#152f5a] text-white hidden md:flex flex-col h-full shadow-2xl">
  <!-- Header del Sidebar -->
  <div class="h-16 flex items-center justify-center border-b border-[#2a4b7d] px-4 relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/5 to-transparent"></div>
    <div class="relative flex items-center gap-2">
      <div class="w-8 h-8 bg-gradient-to-br from-blue-400 to-blue-600 rounded-lg flex items-center justify-center p-1">
        <img src="logo simbolo.png" alt="SEGAR Logo" class="w-full h-full object-contain">
      </div>
      <span class="text-xl font-bold text-white tracking-wide">SEGAR</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-3 py-6 space-y-1">
    <!-- Panel Principal -->
    <a routerLink="/main/panel"
       routerLinkActive="menu-item-active"
       class="menu-item group">
      <div class="menu-item-bg-effect"></div>
      <div class="menu-item-content">
        <div class="menu-item-icon">
          <i class="fas fa-home"></i>
        </div>
        <span class="menu-item-text">Panel Principal</span>
      </div>
      <div class="menu-item-indicator"></div>
    </a>

    <!-- Dashboard -->
    <a routerLink="/main/dashboard"
       routerLinkActive="menu-item-active"
       class="menu-item group">
      <div class="menu-item-bg-effect"></div>
      <div class="menu-item-content">
        <div class="menu-item-icon">
          <i class="fas fa-chart-pie"></i>
        </div>
        <span class="menu-item-text">Dashboard</span>
      </div>
      <div class="menu-item-indicator"></div>
    </a>

    <!-- Calendario -->
    <a routerLink="/main/calendario"
       routerLinkActive="menu-item-active"
       class="menu-item group">
      <div class="menu-item-bg-effect"></div>
      <div class="menu-item-content">
        <div class="menu-item-icon">
          <i class="fas fa-calendar-alt"></i>
        </div>
        <span class="menu-item-text">Calendario</span>
      </div>
      <div class="menu-item-indicator"></div>
    </a>

    <!-- Correos -->
    <a routerLink="/main/correos"
       routerLinkActive="menu-item-active"
       class="menu-item group">
      <div class="menu-item-bg-effect"></div>
      <div class="menu-item-content">
        <div class="menu-item-icon">
          <i class="fas fa-envelope"></i>
        </div>
        <span class="menu-item-text">Correos</span>
      </div>
      <div class="menu-item-indicator"></div>
    </a>

    <!-- Nuevo Producto -->
    <a routerLink="/main/productos"
       routerLinkActive="menu-item-active"
       class="menu-item group">
      <div class="menu-item-bg-effect"></div>
      <div class="menu-item-content">
        <div class="menu-item-icon">
          <i class="fas fa-apple-alt"></i>
        </div>
        <span class="menu-item-text">Nuevo Producto</span>
      </div>
      <div class="menu-item-indicator"></div>
    </a>

    <!-- Nuevo Trámite -->
    <a routerLink="/main/nuevo/tramite"
       routerLinkActive="menu-item-active"
       class="menu-item group">
      <div class="menu-item-bg-effect"></div>
      <div class="menu-item-content">
        <div class="menu-item-icon">
          <i class="fas fa-plus-circle"></i>
        </div>
        <span class="menu-item-text">Nuevo Trámite</span>
      </div>
      <div class="menu-item-indicator"></div>
    </a>

    <!-- Usuarios -->
    <a routerLink="/main/usuarios"
       routerLinkActive="menu-item-active"
       class="menu-item group">
      <div class="menu-item-bg-effect"></div>
      <div class="menu-item-content">
        <div class="menu-item-icon">
          <i class="fas fa-users"></i>
        </div>
        <span class="menu-item-text">Usuarios</span>
      </div>
      <div class="menu-item-indicator"></div>
    </a>

    <!-- Busqueda Global -->
    <a routerLink="/main/busqueda-global"
       routerLinkActive="menu-item-active"
       class="menu-item group">
      <div class="menu-item-bg-effect"></div>
      <div class="menu-item-content">
        <div class="menu-item-icon">
          <i class="fas fa-file-alt"></i>
        </div>
        <span class="menu-item-text">Búsqueda Global</span>
      </div>
      <div class="menu-item-indicator"></div>
    </a>

    <!-- Configuración -->
    <a routerLink="/main/configuracion"
       routerLinkActive="menu-item-active"
       class="menu-item group">
      <div class="menu-item-bg-effect"></div>
      <div class="menu-item-content">
        <div class="menu-item-icon">
          <i class="fas fa-cog"></i>
        </div>
        <span class="menu-item-text">Configuración</span>
      </div>
      <div class="menu-item-indicator"></div>
    </a>

    <!-- Ayuda -->
    <a href="#" class="menu-item group">
      <div class="menu-item-bg-effect"></div>
      <div class="menu-item-content">
        <div class="menu-item-icon">
          <i class="fas fa-question-circle"></i>
        </div>
        <span class="menu-item-text">Ayuda</span>
      </div>
      <div class="menu-item-indicator"></div>
    </a>
  </nav>

  <!-- User Profile Section -->
  <div class="px-4 py-4 border-t border-[#2a4b7d] relative" routerLink="/main/perfil" routerLinkActive="menu-item-active">
    <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/5 to-transparent"></div>
    <div class="relative flex items-center gap-3 p-3 rounded-xl bg-white/10 backdrop-blur-sm border border-white/20 hover:bg-white/15 transition-all duration-300 cursor-pointer group">
      <div class="profile-avatar">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-sm font-bold shadow-lg group-hover:scale-110 transition-transform duration-300">
          {{ userProfile.initials }}
        </div>
        <div class="profile-status"></div>
      </div>
      <div class="flex-1">
        <p class="text-sm font-semibold text-white">{{ userProfile.name || 'Cargando...' }}</p>
        <p class="text-xs text-blue-200">{{ userProfile.role || 'Usuario' }}</p>
      </div>
      <div class="text-white/60 group-hover:text-white transition-colors duration-300">
        <i class="fas fa-chevron-right text-xs"></i>
      </div>
    </div>
  </div>

</aside>

<!-- Topbar con clases CSS personalizadas -->
<header class="topbar-header">
  <!-- Elemento decorativo de fondo -->
  <div class="topbar-shimmer"></div>

  <!-- Logo y título -->
  <div class="topbar-left">
    <div class="topbar-icon-container">
      <svg class="topbar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
      </svg>
    </div>
    <div>
      <h1 class="topbar-title">Sistema de Gestión</h1>
      <p class="topbar-subtitle">Trámites Regulatorios</p>
    </div>
  </div>

  <!-- Sección derecha con logo -->
  <div class="topbar-right">
    <!-- Separador -->
    <div class="topbar-separator"></div>

    <!-- Logo de la empresa -->
    <div class="topbar-logo-container">
      <div class="topbar-logo-wrapper">
        <img src="/Logo segar - copia.jpg" alt="SEGAR Logo" class="topbar-logo">
        <div class="topbar-logo-overlay"></div>
      </div>
    </div>

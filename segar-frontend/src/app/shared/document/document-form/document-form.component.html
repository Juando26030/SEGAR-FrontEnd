<!-- Document Form Header -->
<div class="bg-white border-b p-4">
  <div class="flex items-center justify-between">
    <div>
      <h3 class="text-lg font-semibold text-gray-900">{{ template.name }}</h3>
      <p class="text-sm text-gray-600">{{ template.description }}</p>
    </div>

    <div class="flex items-center gap-2">
      <span
        *ngIf="existingInstance"
        class="px-2 py-1 text-xs font-medium rounded-full"
        [class]="existingInstance.status === 'FINALIZED' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'">
        {{ existingInstance.status | titlecase }}
      </span>

      <button
        (click)="cancel()"
        class="text-gray-400 hover:text-gray-600 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Section Navigation -->
  <div *ngIf="sections.length > 1" class="mt-4">
    <div class="flex items-center justify-between">
      <div class="flex space-x-2">
        <button
          *ngFor="let section of sections; let i = index"
          (click)="currentSection = i"
          class="px-3 py-1 text-sm rounded-md transition-colors"
          [class]="i === currentSection ? 'bg-blue-100 text-blue-700' : 'text-gray-500 hover:text-gray-700'">
          {{ getSectionTitle(section) }}
        </button>
      </div>

      <div class="text-sm text-gray-500">
        {{ currentSection + 1 }} de {{ sections.length }}
      </div>
    </div>
  </div>
</div>

<!-- Form Content -->
<div class="p-6 max-h-96 overflow-y-auto">
  <form [formGroup]="dynamicForm" *ngIf="sections.length > 0">

    <!-- Current Section Fields -->
    <div class="space-y-6">
      <div *ngFor="let field of sections[currentSection]; trackBy: trackByFieldKey">

        <!-- Section Header -->
        <div *ngIf="field.type === 'section-header'" class="border-b pb-2 mb-4">
          <h4 class="text-lg font-medium text-gray-900">{{ field.label }}</h4>
          <p *ngIf="field.helpText" class="text-sm text-gray-600 mt-1">{{ field.helpText }}</p>
        </div>

        <!-- Regular Fields usando DynamicFieldComponent -->
        <div *ngIf="field.type !== 'section-header' && shouldShowField(field)" class="space-y-2">
          <app-dynamic-field
            [field]="field"
            [formControl]="dynamicForm.get(field.key)"
            [tramiteId]="tramiteId"
            [instanceId]="existingInstance?.id">
          </app-dynamic-field>

          <!-- Field Errors -->
          <div *ngIf="getFieldErrors(field.key).length > 0" class="text-sm text-red-600">
            <div *ngFor="let error of getFieldErrors(field.key)">
              {{ error.message }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>

<!-- Form Footer -->
<div class="bg-gray-50 px-6 py-4 border-t flex items-center justify-between">
  <!-- Section Navigation -->
  <div *ngIf="sections.length > 1" class="flex gap-2">
    <button
      *ngIf="currentSection > 0"
      type="button"
      (click)="previousSection()"
      class="inline-flex items-center px-3 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 transition-colors">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Anterior
    </button>

    <button
      *ngIf="currentSection < sections.length - 1"
      type="button"
      (click)="nextSection()"
      [disabled]="!canProceedToNextSection()"
      class="inline-flex items-center px-3 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors">
      Siguiente
      <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>
  </div>

  <!-- Save Actions -->
  <div class="flex gap-2 ml-auto">
    <button
      type="button"
      (click)="saveDraft()"
      [disabled]="isSaving"
      class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
      <svg *ngIf="isSaving" class="animate-spin -ml-1 mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      Guardar borrador
    </button>

    <button
      type="button"
      (click)="saveAndComplete()"
      [disabled]="isSaving || validationErrors.length > 0"
      class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors">
      <svg *ngIf="isSaving" class="animate-spin -ml-1 mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      Completar documento
    </button>
  </div>
</div>

<!-- Validation Summary -->
<div
  *ngIf="validationErrors.length > 0"
  class="bg-red-50 border-t border-red-200 p-4">
  <div class="flex items-center">
    <svg class="w-5 h-5 text-red-400 mr-2" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"/>
    </svg>
    <h4 class="text-sm font-medium text-red-800">Hay {{ validationErrors.length }} errores que corregir:</h4>
  </div>
  <ul class="mt-2 ml-7 text-sm text-red-700 space-y-1">
    <li *ngFor="let error of validationErrors">{{ error.message }}</li>
  </ul>
</div>

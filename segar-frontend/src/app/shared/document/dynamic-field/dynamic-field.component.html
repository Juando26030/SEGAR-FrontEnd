<!-- Dynamic Field Component Template -->
<div class="dynamic-field" [class]="'field-type-' + field.type">

  <!-- Field Label -->
  <label
    *ngIf="field.type !== 'checkbox'"
    [for]="getFieldId()"
    class="block text-sm font-medium text-gray-700 mb-1">
    {{ getFieldLabel() }}
  </label>

  <!-- Help Text -->
  <p *ngIf="field.helpText" class="text-xs text-gray-500 mb-2">
    {{ field.helpText }}
  </p>

  <!-- Text Input Fields -->
  <input
    *ngIf="field.type === 'text' || field.type === 'email' || field.type === 'tel' || field.type === 'url'"
    [id]="getFieldId()"
    [type]="field.type"
    [value]="value"
    [disabled]="disabled"
    [placeholder]="field.placeholder || ''"
    [maxLength]="field.maxLength"
    (input)="onInputChange($event)"
    (blur)="triggerTouched()"
    class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 transition-colors"
    [class.border-red-300]="hasError()"
    [class.focus:ring-red-500]="hasError()"
    [class.focus:border-red-500]="hasError()">

  <!-- Number Input -->
  <input
    *ngIf="field.type === 'number'"
    [id]="getFieldId()"
    type="number"
    [value]="value"
    [disabled]="disabled"
    [placeholder]="field.placeholder || ''"
    (input)="onNumberChange($event)"
    (blur)="triggerTouched()"
    class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 transition-colors"
    [class.border-red-300]="hasError()"
    [class.focus:ring-red-500]="hasError()"
    [class.focus:border-red-500]="hasError()">

  <!-- Textarea -->
  <textarea
    *ngIf="field.type === 'textarea'"
    [id]="getFieldId()"
    [value]="value"
    [disabled]="disabled"
    [placeholder]="field.placeholder || ''"
    [maxLength]="field.maxLength"
    rows="4"
    (input)="onInputChange($event)"
    (blur)="triggerTouched()"
    class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 resize-vertical transition-colors"
    [class.border-red-300]="hasError()"
    [class.focus:ring-red-500]="hasError()"
    [class.focus:border-red-500]="hasError()">
  </textarea>

  <!-- Date/DateTime Input -->
  <input
    *ngIf="field.type === 'date' || field.type === 'datetime-local'"
    [id]="getFieldId()"
    [type]="field.type"
    [value]="value"
    [disabled]="disabled"
    (input)="onInputChange($event)"
    (blur)="triggerTouched()"
    class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 transition-colors"
    [class.border-red-300]="hasError()"
    [class.focus:ring-red-500]="hasError()"
    [class.focus:border-red-500]="hasError()">

  <!-- Select -->
  <select
    *ngIf="field.type === 'select'"
    [id]="getFieldId()"
    [value]="value"
    [disabled]="disabled"
    (change)="onSelectChange($event)"
    (blur)="triggerTouched()"
    class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 transition-colors"
    [class.border-red-300]="hasError()"
    [class.focus:ring-red-500]="hasError()"
    [class.focus:border-red-500]="hasError()">
    <option value="">Seleccionar...</option>
    <option
      *ngFor="let option of field.options"
      [value]="option.value"
      [disabled]="option.disabled">
      {{ option.label }}
    </option>
  </select>

  <!-- Multi Select -->
  <div *ngIf="field.type === 'multiselect'" class="space-y-2">
    <div class="border border-gray-300 rounded-md p-3 max-h-40 overflow-y-auto bg-white"
         [class.border-red-300]="hasError()">
      <div *ngIf="!field.options || field.options.length === 0" class="text-gray-500 text-sm">
        No hay opciones disponibles
      </div>
      <label
        *ngFor="let option of field.options"
        class="flex items-center space-x-2 py-1 cursor-pointer hover:bg-gray-50 rounded px-1 transition-colors">
        <input
          type="checkbox"
          [value]="option.value"
          [disabled]="disabled || option.disabled"
          (change)="onMultiSelectChange(option.value, $event)"
          [checked]="isOptionSelected(option.value)"
          class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
        <span class="text-sm text-gray-700" [class.text-gray-400]="option.disabled">
          {{ option.label }}
        </span>
      </label>
    </div>
  </div>

  <!-- Radio Buttons -->
  <div *ngIf="field.type === 'radio'" class="space-y-2">
    <label
      *ngFor="let option of field.options"
      class="flex items-center space-x-2 cursor-pointer hover:bg-gray-50 rounded p-1 transition-colors">
      <input
        type="radio"
        [name]="getFieldId()"
        [value]="option.value"
        [checked]="value === option.value"
        [disabled]="disabled || option.disabled"
        (change)="onValueChange(option.value)"
        class="border-gray-300 text-blue-600 focus:ring-blue-500">
      <span class="text-sm text-gray-700" [class.text-gray-400]="option.disabled">
        {{ option.label }}
      </span>
    </label>
  </div>

  <!-- Checkbox -->
  <div *ngIf="field.type === 'checkbox'" class="flex items-center space-x-2">
    <input
      [id]="getFieldId()"
      type="checkbox"
      [checked]="value"
      [disabled]="disabled"
      (change)="onCheckboxChange($event)"
      class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"
      [class.border-red-300]="hasError()">
    <label [for]="getFieldId()" class="text-sm text-gray-700 cursor-pointer">
      {{ getFieldLabel() }}
    </label>
  </div>

  <!-- File Upload -->
  <div *ngIf="field.type === 'file'">
    <app-file-upload
      [field]="field"
      [tramiteId]="tramiteId"
      [instanceId]="instanceId"
      [value]="value"
      (valueChange)="onValueChange($event)">
    </app-file-upload>
  </div>

  <!-- Character Count -->
  <div
    *ngIf="(field.type === 'text' || field.type === 'textarea') && field.maxLength"
    class="text-xs mt-1 text-right transition-colors"
    [class.text-amber-500]="isCharacterCountWarning() && !isCharacterCountError()"
    [class.text-red-500]="isCharacterCountError()"
    [class.text-gray-500]="!isCharacterCountWarning()">
    {{ getCharacterCount() }} / {{ field.maxLength }}
  </div>

  <!-- Error Message -->
  <div *ngIf="hasError()" class="mt-1">
    <p class="text-sm text-red-600 flex items-center">
      <svg class="w-4 h-4 mr-1 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"/>
      </svg>
      {{ getErrorMessage() }}
    </p>
  </div>
</div>
